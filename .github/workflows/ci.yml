name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The card reads what the integration produces, so a fixture that has fallen behind its
      # source means the tests below no longer describe the real attributes.
      - name: fixture matches the integration's
        run: >-
          curl -fsSL https://raw.githubusercontent.com/rhgof/ha-bom-warnings/main/tests/fixtures/dashboard/states.json
          | diff - tests/fixtures/states.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # HACS serves the committed file, so a stale build must fail here.
      - name: dist matches the source
        run: git diff --exit-code -- dist

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
